<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Sem conexão | Escalou</title>
  <!-- Página estática servida pelo service worker sem rede: os estilos ficam embutidos porque o CSS do app não está disponível offline. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #050505; color: #f2f5f3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 340px; display: grid; justify-items: center; gap: 12px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 8px 0 0; font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 15px; line-height: 1.5; color: #a5bdae; }
    button { margin-top: 12px; min-height: 48px; width: 100%; border: 0; border-radius: 14px; background: #c5f920; color: #092305; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
    button:focus-visible { outline: 3px solid #f2f5f3; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="96" height="96">
    <h1>Sem conexão</h1>
    <p>Para ver a rodada, o seu time e os rankings atualizados, o Escalou precisa de internet.</p>
    <p>Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
