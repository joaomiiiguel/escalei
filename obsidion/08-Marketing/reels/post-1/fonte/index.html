<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reel 1: Entre em campo</title>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;600;700&family=Sofia+Sans+Extra+Condensed:wght@800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #0D4A32; color: #F3F7E8; font-family: 'Sofia Sans', sans-serif; }
  #campo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .bloco { position: absolute; left: 72px; width: 936px; opacity: 0; }
  .palavra { display: inline-block; }
  .t { margin: 0; font-family: 'Sofia Sans Extra Condensed', sans-serif; font-weight: 900; line-height: 0.88; text-transform: uppercase; }
  .lima { color: #C5F920; }
  .apoio { margin: 0; font-size: 46px; font-weight: 700; line-height: 1.15; }
</style>
</head>
<body>
<div id="stage">
  <svg id="campo" viewBox="0 0 1080 1920">
    <defs>
      <filter id="giz" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="3"></feDisplacementMap>
      </filter>
    </defs>
    <g id="grupo" filter="url(#giz)">
      <g fill="none" stroke="#F3F7E8" stroke-opacity="0.26" stroke-width="5">
        <path d="M72 1000H1008M72 1000V1480H1008V1000"></path>
        <path d="M400 1000A140 140 0 0 0 680 1000"></path>
        <path d="M300 1480V1360H780V1480"></path>
      </g>
      <g id="flechas" fill="none" stroke="#C5F920" stroke-width="7" stroke-linecap="round">
        <path class="flecha" pathLength="1" d="M430 1262C430 1215 495 1190 505 1148"></path>
        <path class="flecha" pathLength="1" d="M650 1262C650 1215 585 1190 575 1148"></path>
        <path class="flecha" pathLength="1" d="M300 1155C350 1120 410 1095 465 1085"></path>
        <path class="flecha" pathLength="1" d="M780 1155C730 1120 670 1095 615 1085"></path>
      </g>
      <g id="time" fill="#0D4A32" stroke="#F3F7E8" stroke-opacity="0.72" stroke-width="6"></g>
      <circle id="vaga" cx="540" cy="1080" r="62" fill="none" stroke="#C5F920" stroke-width="7" stroke-dasharray="16 15"></circle>
      <circle id="onda" cx="540" cy="1080" r="62" fill="none" stroke="#C5F920" stroke-width="6"></circle>
      <g id="voce">
        <circle cx="540" cy="1080" r="62" fill="#C5F920"></circle>
        <text x="540" y="1096" text-anchor="middle" fill="#092305" style="font-family: 'Sofia Sans Extra Condensed', sans-serif; font-weight: 900; font-size: 48px">VOCÊ</text>
      </g>
    </g>
  </svg>

  <div class="bloco" data-de="0" data-ate="3" data-sem-entrada style="top: 330px">
    <h1 class="t" style="font-size: 180px">Você discute <span class="lima">escalação</span> toda rodada?</h1>
  </div>
  <div class="bloco" data-de="3" data-ate="6" style="top: 330px">
    <h1 class="t" style="font-size: 176px">E tem opinião sobre o time de <span class="lima">todo mundo.</span></h1>
  </div>
  <div class="bloco" data-de="6" data-ate="8.5" style="top: 400px">
    <h1 class="t" style="font-size: 260px">Só falta <span class="lima">provar.</span></h1>
  </div>
  <div class="bloco" data-de="8.5" data-ate="12" style="top: 310px">
    <h1 class="t" style="font-size: 150px">O Escalou é o <span class="lima">fantasy do Brasileirão</span> pra disputar com a sua turma.</h1>
  </div>
  <div class="bloco" data-de="12" data-ate="99" style="top: 280px">
    <img src="../../../../../public/LogoH.png" alt="Escalou" style="display: block; width: 286px; height: 67px; object-fit: contain; object-position: left; margin-bottom: 44px">
    <p class="apoio" style="font-size: 56px; margin-bottom: 18px">Você já vive futebol.</p>
    <h1 class="t" style="font-size: 200px">Agora entre <span class="lima">em campo.</span></h1>
    <p class="apoio" style="margin-top: 30px">Sem apostas e sem prêmio em dinheiro.</p>
  </div>
</div>
<script>
  const DURACAO = 16;
  const FUNDOS = [[0, '#0D4A32'], [3, '#06261A'], [6, '#0D4A32'], [8.5, '#06261A'], [12, '#0D4A32']];
  const JOGADORES = [[540, 1420], [210, 1300], [430, 1300], [650, 1300], [870, 1300], [270, 1190], [540, 1190], [810, 1190], [230, 1080], [850, 1080]];
  const NS = 'http://www.w3.org/2000/svg';

  const VAGA = [540, 1080];
  const POUSO = 12.5;

  const time = document.getElementById('time');
  const pessoas = JOGADORES.map(([x, y], i) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 30);
    time.appendChild(c);
    const dist = Math.hypot(VAGA[0] - x, VAGA[1] - y);
    return { c, x, y, i, dist, ux: (VAGA[0] - x) / dist, uy: (VAGA[1] - y) / dist };
  });

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const fase = (t, de, ate) => clamp((t - de) / (ate - de));
  const saida = (p) => 1 - Math.pow(1 - p, 4);
  const suave = (p) => p * p * p * (p * (6 * p - 15) + 10);
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const mistura = (a, b, p) => a.map((v, i) => v + (b[i] - v) * p);

  function quebrar(el) {
    [...el.childNodes].forEach((n) => {
      if (n.nodeType === Node.ELEMENT_NODE) {
        quebrar(n);
      } else if (n.nodeType === Node.TEXT_NODE) {
        const f = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach((parte) => {
          if (!parte.trim()) {
            if (parte) f.append(parte);
            return;
          }
          const s = document.createElement('span');
          s.className = 'palavra';
          s.textContent = parte;
          f.append(s);
        });
        n.replaceWith(f);
      }
    });
  }

  const stage = document.getElementById('stage');
  const grupo = document.getElementById('grupo');
  const vaga = document.getElementById('vaga');
  const onda = document.getElementById('onda');
  const voce = document.getElementById('voce');
  const blocos = [...document.querySelectorAll('.bloco')].map((b) => {
    quebrar(b);
    return {
      b,
      de: Number(b.dataset.de),
      ate: Number(b.dataset.ate),
      semEntrada: 'semEntrada' in b.dataset,
      itens: [...b.querySelectorAll('.palavra, img')],
    };
  });
  const flechas = [...document.querySelectorAll('.flecha')];
  const fundos = FUNDOS.map(([de, cor]) => [de, rgb(cor)]);

  window.DURACAO = DURACAO;
  window.render = (t) => {
    let fundo = fundos[0][1];
    fundos.slice(1).forEach(([corte, cor]) => {
      fundo = mistura(fundo, cor, suave(fase(t, corte - 0.3, corte + 0.3)));
    });
    stage.style.background = `rgb(${fundo.map(Math.round).join(' ')})`;

    blocos.forEach(({ b, de, ate, semEntrada, itens }) => {
      b.style.opacity = t >= de && t < ate ? 1 : 0;
      const fim = suave(fase(t, ate - 0.26, ate));
      itens.forEach((el, i) => {
        const inicio = de + i * 0.045;
        const entrada = semEntrada ? 1 : saida(fase(t, inicio, inicio + 0.42));
        el.style.opacity = entrada * (1 - fim);
        el.style.transform = `translateY(${(1 - entrada) * 48 - fim * 28}px)`;
      });
    });

    flechas.forEach((f, i) => {
      const inicio = 3.15 + i * 0.28;
      f.style.strokeDasharray = 1;
      f.style.strokeDashoffset = 1 - suave(fase(t, inicio, inicio + 0.8));
      f.style.opacity = 1 - suave(fase(t, 5.45, 5.95));
    });

    const zoom = 1 + 0.32 * (suave(fase(t, 5.7, 6.6)) - suave(fase(t, 8.1, 9)));
    const escala = zoom * (1 + 0.012 * Math.sin(t * 0.7));
    const dy = 6 * Math.sin(t * 0.9);
    grupo.setAttribute('transform', `translate(${540 * (1 - escala)} ${1080 * (1 - escala) + dy}) scale(${escala})`);

    const inclina = suave(fase(t, 3.2, 4.2)) - suave(fase(t, 5.3, 6.2));
    const desde = t - POUSO;
    const tranco = desde > 0 ? Math.exp(-desde * 4.5) * Math.sin(desde * 13) : 0;
    pessoas.forEach(({ c, x, y, i, dist, ux, uy }) => {
      const puxa = 16 * inclina - tranco * 34 * (260 / (dist + 130));
      c.setAttribute('cx', x + ux * puxa + 2.5 * Math.cos(t * 1.7 + i * 1.3));
      c.setAttribute('cy', y + uy * puxa + 3.5 * Math.sin(t * 2.1 + i));
    });

    vaga.setAttribute('r', 62 + 5 * Math.sin(t * Math.PI * 1.6));
    vaga.style.opacity = 1 - suave(fase(t, 12.25, POUSO));

    const queda = fase(t, 12.05, POUSO);
    const ressalto = desde > 0 ? 0.17 * Math.exp(-desde * 6) * Math.cos(desde * 20) : 0;
    const s = desde > 0 ? 1 + ressalto : 2.9 - 1.73 * queda * queda;
    voce.style.opacity = clamp(queda * 5);
    voce.setAttribute('transform', `translate(${540 * (1 - s)} ${1080 * (1 - s)}) scale(${s})`);

    const o = fase(t, POUSO, 13.3);
    onda.setAttribute('r', 62 + 170 * saida(o));
    onda.style.opacity = desde > 0 ? 1 - o : 0;
  };
  window.render(0);
</script>
</body>
</html>
